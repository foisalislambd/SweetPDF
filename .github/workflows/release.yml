# Publishes a release for every OS.
#
# A push to main creates a release only when version.md is greater than the
# newest v* tag. An equal or smaller number builds and tests, then stops.
# The tag and the GitHub release are created after every platform has
# succeeded, so a failed run leaves nothing published.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Releases queue rather than cancel each other: a run that is already creating a
# tag must be allowed to finish, or the next one would inherit a half-published
# release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
        with:
          # Tags are the current version. A shallow clone would not see them.
          fetch-depth: 0
          fetch-tags: true

      - name: Compare version.md with the newest tag
        id: decide
        run: |
          set -euo pipefail

          note() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }

          file_version="$(awk '/^([0-9]+)\.([0-9]+)\.([0-9]+)[[:space:]]*$/ { print $1; exit }' version.md)"
          if [[ ! "$file_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.md has no major.minor.patch line"
            exit 1
          fi

          # Highest exact vMAJOR.MINOR.PATCH. Version sort, so v1.10.0 beats v1.9.0.
          # A tag with a suffix is not a release number and is left out.
          latest="$(git tag --list 'v*' --sort=-v:refname | awk '/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/ { sub(/^v/, ""); print; exit }')"
          latest="${latest:-0.0.0}"

          newer() {
            local IFS=.
            local -a want have
            read -r -a want <<< "$1"
            read -r -a have <<< "$2"
            local i
            for i in 0 1 2; do
              local left="${want[$i]:-0}"
              local right="${have[$i]:-0}"
              if (( 10#$left > 10#$right )); then
                return 0
              fi
              if (( 10#$left < 10#$right )); then
                return 1
              fi
            done
            return 1
          }

          if newer "$file_version" "$latest"; then
            tag="v$file_version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$file_version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            note "Releasing $tag. The newest tag was v$latest."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            note "### No release for this push"
            note ""
            note "\`version.md\` says \`$file_version\`, and the newest tag is \`v$latest\`."
            note "A release is created only when \`version.md\` is greater."
            note ""
            note "The build and the tests still run."
          fi

  build:
    name: Build
    needs: gate
    # Main is tested either way. Packaging happens only when a release was decided.
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.gate.outputs.version || '0.0.0' }}
      package: ${{ needs.gate.outputs.release == 'true' }}

  release:
    name: Publish ${{ needs.gate.outputs.tag }}
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Checksum the packages
        working-directory: packages
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -printf '%P\0' | sort -z |
              xargs -0 --no-run-if-empty sha256sum > SHA256SUMS
          if [[ ! -s SHA256SUMS ]]; then
            echo "::error::no packages were downloaded, so there is nothing to release"
            exit 1
          fi
          cat SHA256SUMS

      # gh creates the tag at --target itself, so a tag only ever appears for a
      # run whose builds all passed.
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SweetPDF $VERSION" \
            --generate-notes \
            packages/*
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
