# Publishes a release for every OS.
#
# Order of events: decide whether this push should be released at all, work out
# the next version, build and test every platform, and only if all of them
# succeeded create the tag and the GitHub release. A failing platform cancels the
# others (`fail-fast` in build.yml) and leaves no tag behind, so a failed run
# never produces a half-finished release.
#
# Put "[skip release]" in the commit message to push to main without releasing.
# The build and the tests still run, so main stays verified either way.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (default: the next one after the latest tag)'
        required: false
        type: string

# Releases queue rather than cancel each other: a run that is already creating a
# tag must be allowed to finish, or the next one would inherit a half-published
# release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Look for a skip marker in the commit message
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          note() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # A manual run is an explicit request to release, so no marker applies.
          if [[ "$EVENT" != "push" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            note "Manual run: releasing."
            exit 0
          fi

          # Read from the head commit, in the same spirit as GitHub's own
          # [skip ci], and accept the spellings people actually type.
          if grep -qiE '\[(skip[ -]release|release[ -]skip|no[ -]release)\]' <<<"$MESSAGE"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            note "### No release for this push"
            note ""
            note "The head commit message asks to skip it:"
            note ""
            note '```'
            note "$MESSAGE"
            note '```'
            note ""
            note "The build and the tests still ran."
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

  version:
    name: Work out the version
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
        with:
          # The whole history: next-version.sh reads the existing tags.
          fetch-depth: 0

      - name: Pick the next version
        id: pick
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(./scripts/next-version.sh "${REQUESTED#v}")"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists - pass a different version or delete the tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: [gate, version]
    # Runs even when the release is skipped, because main is still worth testing.
    # The version job is skipped in that case, and there is nothing to package.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.version.result != 'failure' }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version || '0.0.0' }}
      package: ${{ needs.gate.outputs.release == 'true' }}

  release:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [gate, version, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Checksum the packages
        working-directory: packages
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -printf '%P\0' | sort -z |
              xargs -0 --no-run-if-empty sha256sum > SHA256SUMS
          if [[ ! -s SHA256SUMS ]]; then
            echo "::error::no packages were downloaded, so there is nothing to release"
            exit 1
          fi
          cat SHA256SUMS

      # gh creates the tag at --target itself, so a tag only ever appears for a
      # run whose builds all passed.
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SweetPDF $VERSION" \
            --generate-notes \
            packages/*
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
