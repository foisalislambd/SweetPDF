# Builds, tests and (optionally) packages SweetPDF on every supported OS.
#
# This is a reusable workflow: `ci.yml` calls it to check pushes and pull
# requests, `release.yml` calls it with the version of the release it is about to
# publish. Everything lives in one matrix job on purpose - `fail-fast: true` then
# cancels the still-running platforms the moment one of them fails, so a broken
# build never burns minutes and never reaches the release job.

name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries and the package names.
        required: true
        type: string
      package:
        description: Produce installable packages and upload them as artifacts.
        required: false
        default: false
        type: boolean
      warnings_as_errors:
        description: Fail the build on compiler warnings.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 26.04 is the oldest image whose MuPDF (1.27) has the APIs the
          # editor uses, so the .deb targets 26.04 and newer.
          - name: linux-x86_64
            runner: ubuntu-26.04
            arch: x86_64
            shell: bash
          - name: windows-x86_64
            runner: windows-2025
            arch: x86_64
            shell: msys2 {0}
          # macOS is left out deliberately: it needs macos-* runners. To ship
          # .dmg builds later, add:
          #   - { name: macos-arm64, runner: macos-15, arch: arm64, shell: bash }

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Check out the sources
        uses: actions/checkout@v7

      - name: Install the Linux toolchain and libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config file \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev qt6-qpa-plugins \
            libmupdf-dev libfreetype-dev libharfbuzz-dev libjpeg-dev \
            libopenjp2-7-dev libjbig2dec0-dev libgumbo-dev libmujs-dev \
            zlib1g-dev libsqlite3-dev libtesseract-dev libleptonica-dev \
            tesseract-ocr-eng \
            libgl1-mesa-dev libxkbcommon-dev ghostscript

      - name: Install the MSYS2 toolchain and libraries
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          # MINGW64 no longer has libmupdf. UCRT64 is the environment MSYS2
          # still publishes MuPDF, Qt and Tesseract for.
          msystem: UCRT64
          update: true
          install: >-
            zip
          # ghostscript renders the test document, without it the test suite has
          # nothing to open; nsis builds the installer; gdb is only used to turn a
          # crashing test into a backtrace.
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p gdb:p nsis:p
            qt6-base:p qt6-svg:p qt6-tools:p
            libmupdf:p sqlite3:p tesseract-ocr:p tesseract-data-eng:p ghostscript:p

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSWEETPDF_VERSION="${{ inputs.version }}" \
            -DSWEETPDF_PACKAGE_ARCH="${{ matrix.arch }}" \
            -DSWEETPDF_WARNINGS_AS_ERRORS=${{ inputs.warnings_as_errors && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      # A crash inside a test tells us nothing on its own, and the interesting
      # ones have only ever appeared on this runner. Re-run the smoke test under
      # gdb so the log carries a backtrace instead of just "SegFault".
      - name: Backtrace the failing test
        if: failure() && runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          gdb --batch --nx \
            -ex 'set confirm off' \
            -ex run \
            -ex 'echo \n--- backtrace ---\n' \
            -ex 'thread apply all backtrace full' \
            --args ./build/bin/sweetpdf_smoke.exe build/tests/sample.pdf || true

      - name: Package for Linux
        if: inputs.package && runner.os == 'Linux'
        shell: bash
        run: cd build && cpack

      # windeployqt brings Qt and its plugins, but not MuPDF, Tesseract or the
      # compiler runtime, so those are walked out of the import tables by hand.
      # The finished folder becomes both artifacts: the portable zip is that folder,
      # and the installer packages it.
      - name: Package for Windows
        if: inputs.package && runner.os == 'Windows'
        run: |
          set -euo pipefail
          stage="dist/SweetPDF"
          rm -rf dist
          cmake --install build --prefix "$stage"
          # MSYS2 names the tool after the Qt major version; plain Windows Qt
          # builds do not.
          deploy="$(command -v windeployqt-qt6 || command -v windeployqt)"
          "$deploy" --release --no-translations --no-system-d3d-compiler \
            --no-opengl-sw "$stage/sweetpdf.exe"
          ./scripts/copy-mingw-dlls.sh "$stage"

          # Refuse to ship a folder the deploy step left incomplete: an installer
          # that produces an unstartable program is worse than a failed build.
          for required in sweetpdf.exe Qt6Core.dll Qt6Widgets.dll; do
            test -f "$stage/$required" || { echo "::error::$required missing from $stage"; exit 1; }
          done
          test -d "$stage/platforms" || { echo "::error::no Qt platform plugins in $stage"; exit 1; }

          mkdir -p build
          base="sweetpdf-${{ inputs.version }}-windows-${{ matrix.arch }}"

          # The portable archive is the same folder, for people who cannot or would
          # rather not run an installer.
          (cd dist && zip -r -q "../build/$base.zip" SweetPDF)

          setup="build/$base-setup.exe"
          # Absolute Windows paths throughout: makensis resolves a relative one
          # differently depending on the command it appears in.
          makensis -V3 \
            -DVERSION="${{ inputs.version }}" \
            -DARCH="${{ matrix.arch }}" \
            -DSTAGE="$(cygpath -w "$PWD/$stage")" \
            -DOUTFILE="$(cygpath -w "$PWD/$setup")" \
            -DICON="$(cygpath -w "$PWD/resources/icons/sweetpdf.ico")" \
            -DLICENSEFILE="$(cygpath -w "$PWD/LICENSE")" \
            packaging/windows/sweetpdf.nsi
          ls -lh "build/$base.zip" "$setup"

      - name: Upload the packages
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: sweetpdf-${{ matrix.name }}
          path: |
            build/*.deb
            build/*.tar.gz
            build/*.zip
            build/*-setup.exe
          if-no-files-found: error
          retention-days: 7
